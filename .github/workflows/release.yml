name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$DOTENV" ]; then
            printf '%s' "$DOTENV" > .env
          else
            cp .env.example .env
          fi

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build universal APK
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          --build-name=${{ inputs.version }}
          --build-number=${{ github.run_number }}

      - name: Collect universal APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/yapp-${{ inputs.version }}-universal.apk

      - name: Build split-per-abi APKs
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --build-name=${{ inputs.version }}
          --build-number=${{ github.run_number }}

      - name: Collect split APKs and symbols
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/yapp-${{ inputs.version }}-$abi.apk
          done
          cd build && zip -r ../dist/yapp-${{ inputs.version }}-symbols.zip symbols

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: yapp v${{ inputs.version }}
          files: dist/*
