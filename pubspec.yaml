name: yapp
description: "yapp is an end-to-end encrypted messenger with zero-PII keypair identity."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  emoji_picker_flutter: ^4.4.0
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  http: ^1.2.2
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  sqflite: ^2.4.2
  uuid: ^4.5.1
  bip39: ^1.0.6
  mobile_scanner: ^7.0.0
  libsignal: ^5.0.0
  flutter_dotenv: ^5.1.0
  file_picker: ^8.1.4
  geolocator: ^13.0.2
  record: ^5.2.0
  just_audio: ^0.9.42
  supabase_flutter: ^2.8.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

dependency_overrides:
  record_linux:
    path: third_party/record_linux

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/icon/app_icon.png
